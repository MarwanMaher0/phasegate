name: Feature request
description: Suggest a change or a new capability for phasegate.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The roadmap lives in the open issues, so check there first. phasegate makes no network calls and has no telemetry; proposals need to keep it that way.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: How you would like it to work. Config, commands or code sketches help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to open a pull request for this.
